version: '3.8'

services:
  trenggalek-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trenggalek-api-gateway
    restart: always
    environment:
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Automatic HTTPS & Reverse Proxy for satudata.titanialab.com
  caddy:
    image: caddy:latest
    container_name: caddy-ssl-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - trenggalek-api-gateway

volumes:
  caddy_data:
  caddy_config:
