version: '3.8'

services:
  trenggalek-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trenggalek-api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
