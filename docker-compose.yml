version: '3.8'

services:
  trenggalek-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NODE_ENV=production
    ports:
      - "3005:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
