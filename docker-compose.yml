version: '3.8'

services:
  trenggalek-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NODE_ENV=production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
    command: caddy reverse-proxy --from http://satudata-trenggalek.titanialab.com --from http://trenggalek.titanialab.com --to trenggalek-api-gateway:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - trenggalek-api-gateway

volumes:
  caddy_data:
  caddy_config:
